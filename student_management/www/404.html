{% extends "templates/web.html" %}

{% block page_content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
</head>

<body style="margin:0; padding:0; background:#f4f7fc; font-family:Arial, Helvetica, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh;">

    <div style="text-align:center; background:#ffffff; padding:50px; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.15); max-width:500px; width:90%;">

        <h1 style="font-size:100px; margin:0; color:#ff4d4d;">
            404
        </h1>

        <h2 style="margin:10px 0; color:#333333;">
            Oops! Page Not Found
        </h2>

        <p style="color:#666666; font-size:16px; line-height:1.6;">
            The page you are looking for might have been removed,
            had its name changed, or is temporarily unavailable.
        </p>

        <a href="/"
           style="display:inline-block; margin-top:25px; padding:12px 30px; background:#007bff; color:white; text-decoration:none; border-radius:6px; font-size:16px; font-weight:bold;">
            Go Back Home
        </a>

    </div>

</body>
</html>
{% endblock %}
